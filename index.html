<style>
  body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f9}
  .tab-btn.active{background:#0f172a;color:#fff}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .stripe{border-left:5px solid}
  .modal-bg{background:rgba(15,23,42,.6);backdrop-filter:blur(3px)}
  #map{height:300px;border-radius:12px;z-index:0}
  .scrollbar-thin::-webkit-scrollbar{height:6px;width:6px}.scrollbar-thin::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
  .kv dt{color:#64748b;white-space:nowrap}.kv dd{color:#0f172a}
  .star{color:#f59e0b}
  .pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .dual{position:relative;height:30px}
  .dual .track,.dual .fill{position:absolute;top:12px;height:6px;border-radius:3px}.dual .track{left:11px;right:11px;background:#e2e8f0}.dual .fill{background:#f97316}
  .dual input[type=range]{position:absolute;left:0;top:4px;width:100%;margin:0;height:22px;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input[type=range]::-webkit-slider-runnable-track{height:22px;background:transparent}
  .dual input[type=range]::-moz-range-track{height:22px;background:transparent}
  .dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#0f172a;border:3px solid #fff;box-shadow:0 1px 5px rgba(15,23,42,.45);cursor:grab}
  .dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#0f172a;border:3px solid #fff;box-shadow:0 1px 5px rgba(15,23,42,.45);cursor:grab}
  .fade-in{animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<header class="bg-slate-900 text-white">
  <div class="max-w-7xl mx-auto px-4 py-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <div class="text-xs tracking-widest text-orange-300 font-bold" id="goal-label">RUN TRAINING</div>
        <h1 class="text-2xl md:text-3xl font-black">Louis Tsai <span class="text-orange-400">·</span> Run Training 2026-2027 <span class="text-slate-400 font-medium text-lg block md:inline">AI 科學化教練儀表板</span></h1>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
let D = null; const charts = {}; let map = null;
const TYPE_LABEL = {recovery:"恢復跑", easy:"輕鬆跑", long:"長距離", progression:"漸速長跑", tempo:"閾值/節奏", interval:"間歇", race:"比賽/測驗", strides:"短程", rest:"休息", other:"其他"};
const TYPE_COLOR = {recovery:"#94a3b8", easy:"#22c55e", long:"#3b82f6", progression:"#6366f1", tempo:"#f97316", interval:"#ef4444", race:"#a855f7", strides:"#cbd5e1", rest:"#e2e8f0", other:"#cbd5e1"};
const STATUS = {hit:["✅ 已完成","bg-emerald-100 text-emerald-700"], partial:["🟡 部分達成","bg-amber-100 text-amber-700"], diff:["🔁 內容不同","bg-sky-100 text-sky-700"], missed:["❌ 未執行","bg-rose-100 text-rose-700"], rest_ok:["✔ 休息","bg-slate-100 text-slate-500"], today:["📍 今天","bg-orange-500 text-white pulse"], today_done:["📍 今天 ✅","bg-emerald-500 text-white"], upcoming:["",""]};
const fmtPace = s => (s==null||!isFinite(s)||s<=0) ? "-" : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
const fmtTime = s => { if(s==null) return "-"; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const stars = n => '<span class="star">'+"★".repeat(n)+'</span><span class="text-slate-300">'+"★".repeat(5-n)+'</span>';
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b? Math.round(a/b*100):0;

function mkChart(id, cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(!el) return; charts[id]=new Chart(el, cfg); }
// Draws work/rest bands + boundary lines (auto laps) on a category-axis line chart.
const segPlugin = { id:"segs", afterDatasetsDraw(chart, args, opts){
  const segs = (opts && opts.segs) || []; if(!segs.length) return;
  const {ctx, chartArea:{top,bottom}, scales:{x}} = chart; ctx.save();
  for(const sg of segs){
    const x0 = x.getPixelForValue(sg.i0), x1 = x.getPixelForValue(sg.i1); if(!(isFinite(x0)&&isFinite(x1))) continue;
    if(sg.kind==="work"){ ctx.fillStyle="rgba(249,115,22,0.10)"; ctx.fillRect(x0, top, Math.max(1,x1-x0), bottom-top); }
    else if(sg.kind==="rest"){ ctx.fillStyle="rgba(100,116,139,0.10)"; ctx.fillRect(x0, top, Math.max(1,x1-x0), bottom-top); }
    ctx.strokeStyle = sg.kind==="work" ? "rgba(234,88,12,0.7)" : "rgba(100,116,139,0.5)"; ctx.lineWidth = 1; ctx.setLineDash(sg.kind==="work"?[]:[3,3]);
    ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, bottom); ctx.stroke();
    if(sg.kind==="work" || (sg.kind==="rest" && x1-x0>22) || sg.kind==="warmup" || sg.kind==="cooldown"){
      ctx.fillStyle = sg.kind==="work" ? "#c2410c" : "#475569"; ctx.font = "bold 10px sans-serif"; ctx.textAlign="left";
      ctx.fillText(sg.short, x0+2, top+10);
    }
  }
  ctx.setLineDash([]); ctx.restore();
}};

// ------------------------------------------------------------ tabs
$$("#tabs button").forEach(b=>b.onclick=()=>{ $$("#tabs button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); $$(".tab").forEach(t=>t.classList.add("hidden")); $("#tab-"+b.dataset.tab).classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"}); if(b.dataset.tab==="weekly"){ renderWeeklyCharts(); loadArchive(); } if(b.dataset.tab==="chat") askLoad(); if(b.dataset.tab==="overview") renderOverviewCharts(); if(b.dataset.tab==="wellness") renderWellnessCharts(); if(b.dataset.tab==="tech") renderTechCharts(); if(b.dataset.tab==="calc") calcRun(); if(b.dataset.tab==="form" && !$("#tab-form").innerHTML) renderFormTab(); });

// ------------------------------------------------------------ load
fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(async d=>{ D=d; await autoUnlock(); renderAll(); if(typeof location!=="undefined" && location.hash){ const tb = $$("#tabs button").find(x=>x.dataset.tab===location.hash.slice(1)); if(tb && tb.onclick) tb.onclick(); } }).catch(e=>{ $("#tab-overview").innerHTML = `<div class="card p-6 text-rose-600">資料載入失敗：${esc(e)}</div>`; });

function renderAll(){
  $("#updated").textContent = D.generated_at;
  $("#goal-label").textContent = `目前目標賽事 · ${D.race.name} ${D.race.date.replace(/-/g,"/")} · A ${D.race.goal_A} / B ${D.race.goal_B}`;
  $("#synced").textContent = D.last_sync_at || D.generated_at;
  $("#schedule-note").textContent = D.sync_schedule || "";
  $("#countdown").textContent = `距離比賽 ${D.race.days_left} 天`;
  if(D.notify && D.notify.length){ $("#notify").classList.remove("hidden"); $("#notify").innerHTML = `<div class="card p-4 border-l-4 border-emerald-500 flex items-start gap-3"><div class="text-2xl">🆕</div><div><div class="font-bold">已更新訓練 (${D.generated_at})</div><div class="text-sm text-slate-600">新增 ${D.notify.length} 筆：${D.notify.map(n=>esc(n)).join("、")}。課表已依最新數據重新計算。</div></div></div>`; }
  renderOverview(); renderPlan(); renderHistory(); renderWeekly(); renderWellness(); renderMethod(); renderTech(); renderCalc(); renderChat(); renderRaces();
  renderLockState(); renderFormTab();
  renderOverviewCharts();
}

// ------------------------------------------------------------ overview
function renderOverview(){
  const a = D.athlete, r = D.race, p = D.plan;
  const cur = p.weeks[0];
  const todayStr = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
  const todayDay = cur.days.find(x=>x.date===todayStr) || cur.days[0];
  const nextDay = cur.days.find(x=>x.date>todayStr && x.session.type!=="rest") || (p.weeks[1]||cur).days.find(x=>x.session.type!=="rest");
  const kpi = (label, val, sub, color="text-slate-900") => `<div class="card p-4"><div class="text-xs text-slate-500 font-bold">${label}</div><div class="text-2xl font-black ${color} mt-1">${val}</div><div class="text-xs text-slate-500 mt-1">${sub||""}</div></div>`;
  $("#tab-overview").innerHTML = `
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
    ${kpi("目標 A", r.goal_A, `配速 ${r.goal_A_pace}/km · 需 VDOT ${r.goal_A_vdot}`, "text-orange-600")}
    ${kpi("目標 B (底線)", r.goal_B, `配速 ${r.goal_B_pace}/km · 需 VDOT ${r.goal_B_vdot}`, "text-amber-600")}
    ${kpi("目前 VDOT", a.vdot, `推估半馬 ${a.pred_hm}${a.coros_hm_pred? " · COROS 預測 "+a.coros_hm_pred:""}`, "text-sky-700")}
    ${kpi("與目標差距", `${a.gap_B>0?"+":""}${a.gap_B} / ${a.gap_A>0?"+":""}${a.gap_A}`, "VDOT：破 90 / 破 87", a.gap_B<=0.3?"text-emerald-600":"text-rose-600")}
    ${kpi("本週跑量", `${cur.actual_km} <span class="text-base text-slate-400">/ ${cur.target_km} km</span>`, `${cur.phase} · 計畫 ${cur.planned_km} km`)}
    ${kpi("急慢性負荷比 ACWR", p.acwr??"-", p.acwr==null?"資料不足": p.acwr>1.4?"⚠️ 偏高，注意降載": p.acwr<0.8?"偏低（恢復/減量中）":"✅ 安全區 0.8–1.3", p.acwr>1.4?"text-rose-600":"text-emerald-600")}
  </div>
  <div class="card p-5 border-l-4 border-sky-500">
    <div class="font-black text-lg mb-1">🎯 教練總評</div>
    <p class="text-slate-700 leading-relaxed">${esc(a.verdict)}</p>
    <p class="text-xs text-slate-500 mt-2">VDOT 由近 8 週 ${a.n_samples} 筆「配速 × 心率儲備」推估${a.coros_vo2max? "，並與 COROS VO2max "+a.coros_vo2max+" 加權":""}；HRmax ${a.hrmax} bpm、靜止心率 ${a.hrrest} bpm。12/13 的 10K 測驗會提供最準確的校準。</p>
  </div>
  ${sleepWarn(D.wellness||{})}
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="space-y-5">
      ${dayCard(todayDay, cur, true)}
      ${nextDay && nextDay!==todayDay ? `<div class="text-xs font-bold text-slate-500 -mb-3 ml-1">下一堂課</div>${dayCard(nextDay, cur, false)}`:""}
    </div>
    <div class="space-y-5">
      <div class="card p-5"><div class="font-black mb-2">近 8 週跑量與平均配速</div><canvas id="ch-vol" height="170"></canvas></div>
      <div class="card p-5"><div class="font-black mb-2">VDOT 近 8 週樣本</div><canvas id="ch-vdot" height="130"></canvas></div>
    </div>
  </div>
  <div class="card p-5" id="vdot-card">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><div class="font-black text-lg">VDOT 走勢（${(D.vdot_history&&D.vdot_history.points&&D.vdot_history.points.length)? D.vdot_history.points[0].date.slice(0,7).replace("-","/"):"—"} 至今）</div>
        <div class="text-xs text-slate-500">每點 = 一次跑步的 VDOT 推估（🏁 比賽用 Daniels 成績公式；穩態跑用「配速 × 心率儲備」模型，室內與間歇課不計）。黑線 = 42 天滾動趨勢。虛線 = 所選距離的達標點，只顯示與你能力相近的區間。</div></div>
      <div class="flex flex-wrap gap-2 text-xs">
        <div class="flex rounded-full bg-slate-100 p-0.5" id="vdot-dist">${["5K","10K","半馬","全馬"].map(k=>`<button onclick="vdotDist='${k}';renderVdotChart()" class="px-3 py-1 rounded-full font-bold">${k}</button>`).join("")}</div>
        <div class="flex rounded-full bg-slate-100 p-0.5" id="vdot-range">${[["all","全部"],["365","12 個月"],["180","6 個月"],["90","3 個月"]].map(k=>`<button onclick="vdotRange='${k[0]}';renderVdotChart()" class="px-3 py-1 rounded-full font-bold">${k[1]}</button>`).join("")}</div>
      </div>
    </div>
    <canvas id="ch-vdot-hist" height="150"></canvas>
    <div id="vdot-milestones" class="mt-3"></div>
  </div>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="card p-5">
      <div class="font-black mb-3">本週訓練配速表 (VDOT ${cur.vdot_k})</div>
      <table class="w-full text-sm"><tbody>
        ${[["E 輕鬆", cur.paces.E_slow+" – "+cur.paces.E_fast, "有氧底座、恢復；Z1–Z2"],["M 馬拉松", cur.paces.M, "穩態有氧上緣；長跑末段"],["HMP 半馬目標", cur.hmp, "本週專項配速 (逐週逼近 "+r.goal_A_pace+")"],["T 閾值", cur.paces.T, "乳酸閾值；挪威式 sub-T 上限"],["10K", cur.paces.K10_pace, "10K 配速 / 1000 m 間歇"],["I 間歇", cur.paces.I, "VO2max；跑班 400–1200 m"],["R 反覆", cur.paces.R, "速度/經濟性；200–400 m"]].map(x=>`<tr class="border-b border-slate-100"><td class="py-1.5 font-bold">${x[0]}</td><td class="py-1.5 font-mono text-right text-sky-700 font-bold">${x[1]}</td><td class="py-1.5 text-xs text-slate-500 pl-3">${x[2]}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="card p-5">
      <div class="font-black mb-3">心率區間 (HRmax ${a.hrmax})</div>
      <div class="space-y-2">${a.zones.map((z,i)=>`<div class="flex items-center gap-3 text-sm"><div class="w-16 font-bold">${z.name}</div><div class="flex-1 h-3 rounded-full" style="background:${["#94a3b8","#22c55e","#f59e0b","#f97316","#ef4444"][i]};opacity:.85"></div><div class="w-28 text-right font-mono">${z.lo}${i===4?"+":" – "+z.hi} bpm</div></div>`).join("")}</div>
      <div class="text-xs text-slate-500 mt-3">閾值課請以 Z3 上緣～Z4（${Math.round(a.hrmax*0.86)}–${Math.round(a.hrmax*0.91)}）為上限；輕鬆日 < ${Math.round(a.hrmax*0.80)}。</div>
    </div>
  </div>
  <div class="card p-5"><div class="font-black mb-2">12 週週期總覽</div><canvas id="ch-period" height="110"></canvas></div>`;
}

function renderOverviewCharts(){
  if(!D) return;
  const W = D.weekly;
  mkChart("ch-vol", {type:"bar", data:{labels:W.map(w=>w.label), datasets:[
    {label:"戶外 km", data:W.map(w=>w.outdoor_km), backgroundColor:"#3b82f6", stack:"a", yAxisID:"y"},
    {label:"室內 km", data:W.map(w=>w.indoor_km), backgroundColor:"#93c5fd", stack:"a", yAxisID:"y"},
    {label:"平均配速", data:W.map(w=>w.pace_s? w.pace_s/60:null), type:"line", borderColor:"#f97316", backgroundColor:"#f97316", yAxisID:"y2", tension:.3, spanGaps:true}]},
    options:{responsive:true, interaction:{mode:"index"}, plugins:{legend:{position:"bottom"}, tooltip:{callbacks:{label:c=> c.dataset.yAxisID==="y2"? "配速 "+fmtPace(c.raw*60)+"/km" : c.dataset.label+" "+c.raw+" km"}}},
      scales:{y:{title:{display:true,text:"km"}, stacked:true}, y2:{position:"right", reverse:true, grid:{drawOnChartArea:false}, ticks:{callback:v=>fmtPace(v*60)}, title:{display:true,text:"配速 /km"}}}}});
  const S = D.athlete.vdot_samples||[];
  mkChart("ch-vdot", {type:"scatter", data:{datasets:[{label:"單次推估 VDOT", data:S.map(s=>({x:s.date, y:s.vdot})), backgroundColor:"#0ea5e9"},
      {label:"採用值", data:S.length? [{x:S[0].date,y:D.athlete.vdot},{x:S[S.length-1].date,y:D.athlete.vdot}]:[], type:"line", borderColor:"#0f172a", borderDash:[6,4], pointRadius:0},
      {label:"破 90 需求", data:S.length? [{x:S[0].date,y:D.race.goal_B_vdot},{x:S[S.length-1].date,y:D.race.goal_B_vdot}]:[], type:"line", borderColor:"#f59e0b", pointRadius:0},

const dayNum = d => Math.round(Date.parse(d)/86400000);

function renderVdotChart(){
  const H = D.vdot_history||{points:[],trend:[]}; if(!document.getElementById("ch-vdot-hist")) return;

  const pts = H.points.filter(p=>dayNum(p.date)>=minN), tr = H.trend.filter(p=>dayNum(p.date)>=minN);
  const cur = D.athlete.vdot;

  const xmin = minN, xmax = todayN + 14;

  const goalLines = (vdotDist==="半馬") ? [] : [];
  const ds = [
    {label:"趨勢（42 天滾動）", data:tr.map(p=>({x:dayNum(p.date), y:p.vdot, _l:`趨勢 ${p.date}（${p.n} 筆）`})), type:"line", borderColor:"#0f172a", borderWidth:2.5, pointRadius:0, tension:.3, order:1},
    {label:"穩態跑推估", data:pts.filter(p=>p.type==="steady").map(p=>({x:dayNum(p.date), y:p.vdot, _l:p.label})), type:"scatter", backgroundColor:"#0ea5e980", pointRadius:4, order:3},

    {label:`目前採用 ${cur}`, data:[{x:xmin,y:cur},{x:xmax,y:cur}], type:"line", borderColor:"#16a34a", borderWidth:1.5, pointRadius:0, order:4},
    ...lines.map((l,i)=>({label:`${vdotDist} ${l.t} · VDOT ${l.vdot.toFixed(1)}`, data:[{x:xmin,y:l.vdot},{x:xmax,y:l.vdot}], type:"line", borderColor:palette[i%palette.length], borderDash:[6,5], borderWidth:1.2, pointRadius:0, order:5})),
  ];

    scales:{x:{type:"linear", min:xmin, max:xmax, ticks:{callback:v=>dayStr(v), maxTicksLimit:12}, title:{display:true,text:"日期"}}, y:{min:ymin, max:ymax, title:{display:true,text:"VDOT"}}}}});

const ARCH = {data:null, loading:false, err:null, i0:null, i1:null, open:{}, byId:{}, byWeek:{}, detail:{}, quick:"12", _t:null};
function loadArchive(){
  if(ARCH.data){ renderArchive(); return; }
  if(ARCH.loading) return;
  ARCH.loading = true; ARCH.err = null; renderArchive();
  fetch("history.json?t="+Date.now(), {cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(h=>{
    const idx = {}; h.weeks.forEach((wk,i)=>{ idx[wk.monday] = i; ARCH.byWeek[i] = []; });
    h.workouts.forEach(w=>{ ARCH.byId[w.labelId] = w; const d = new Date(w.date+"T00:00:00Z"); d.setUTCDate(d.getUTCDate() - (d.getUTCDay()+6)%7); const k = d.toISOString().slice(0,10); if(idx[k]!=null) ARCH.byWeek[idx[k]].push(w); });
    const n = h.weeks.length; ARCH.i1 = n-1; ARCH.i0 = Math.max(0, n-12); ARCH.open[h.weeks[n-1].monday] = true;
    ARCH.data = h; ARCH.loading = false; renderArchive();
  }).catch(e=>{ ARCH.loading = false; ARCH.err = String(e); renderArchive(); });
}
function renderArchive(){
  const el = $("#arch"); if(!el) return;
  const head = `<div class="flex flex-wrap items-end justify-between gap-2"><div><div class="font-black text-lg">📚 過往紀錄 — 以週為單位自由拉區間</div><div class="text-sm text-slate-600 mt-0.5">拖曳下方兩個圓鈕（或用快捷鍵／下拉選單）選擇起訖週，查看該區間每一週的跑量、配速、心率與每一次訓練。</div></div>`;

function sleepWarn(w){
  const s = (w.sleep_series||[]).filter(x=>x.hours>=2.5);
  if(!s.length) return "";
  const avg = s.reduce((a,x)=>a+x.hours,0)/s.length;
  const short = s.filter(x=>x.hours<6).length;
  const napN = s.filter(x=>(x.nap||0)>=0.3).length, avgT = s.reduce((a,x)=>a+(x.total||x.hours),0)/s.length;
  const napTxt = napN ? `含補眠的全日平均為 <b>${avgT.toFixed(1)} 小時</b>（${napN} 天有補眠）；補眠能補回一部分，但 HRV 與深層修復主要發生在夜間，所以課表的門檻看的是夜間睡眠。` : "";
  if(avg>=7) return `<div class="card p-4 border-l-4 border-emerald-500 text-sm">😴 近 ${s.length} 晚平均主睡眠 <b>${avg.toFixed(1)} 小時</b>，恢復條件良好。</div>`;
  return `<div class="card p-4 border-l-4 border-rose-500 text-sm"><b>😴 睡眠是你目前最大的訓練限制：</b>近 ${s.length} 晚平均主睡眠只有 <b>${avg.toFixed(1)} 小時</b>（其中 ${short} 晚不到 6 小時）。${napTxt}研究顯示睡眠 <6 小時會讓肌肉修復與肝醣回補效率下降 20–30%、受傷風險上升約 1.7 倍。接下來 11 週，把「每晚 7 小時」當成和週跑量一樣重要的 KPI；品質課前一晚睡不足 6 小時時，課表會建議降級為 E 配速。</div>`;
}

function bandNote(b){

}

// ------------------------------------------------------------ pace calculator (all formulas client-side; Daniels/Gilbert)
const DIST = [["400 m",400],["800 m",800],["1 km",1000],["1600 m / 英里",1609.34],["3 km",3000],["5 km",5000],["10 km",10000],["15 km",15000],["半馬 21.0975 km",21097.5],["全馬 42.195 km",42195],["自訂",0]];
const vo2At = v => -4.60 + 0.182258*v + 0.000104*v*v;                     // v in m/min
const pctMax = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); // t in min
const velForVo2 = vo2 => (-0.182258 + Math.sqrt(0.182258*0.182258 + 4*0.000104*(4.6+vo2)))/(2*0.000104);
const vdotFromRace = (d, s) => { const t=s/60, v=d/t; return vo2At(v)/pctMax(t); };
const raceTimeFor = (vdot, d) => { let t=d/200; for(let i=0;i<80;i++){ const v=velForVo2(vdot*pctMax(t)); const tn=d/v; if(Math.abs(tn-t)<1e-5){t=tn;break;} t=tn;} return t*60; };
const paceAtFrac = (vdot, f) => 1000/velForVo2(vdot*f)*60;  // s/km
function parseHMS(str){ if(!str) return null; const p=str.trim().split(":").map(Number); if(p.some(isNaN)) return null; if(p.length===3) return p[0]*3600+p[1]*60+p[2]; if(p.length===2) return p[0]*60+p[1]; return p[0]; }

let calcMode = "time";
function calcPreset(d, t){ $("#c-dist").value = d; if(t){ $("#c-time").value = t; $("#c-pace").value=""; calcMode="time"; } else { $("#c-pace").value = D.athlete.paces.I; $("#c-time").value=""; calcMode="pace"; } calcRun(); }
function calcRun(){
  const out = $("#c-out"); if(!out) return;
  let dist = +$("#c-dist").value; if(!dist) dist = +($("#c-custom").value||0); if(!dist){ out.innerHTML=""; return; }
  let total, pace;
  if(calcMode==="time"){ total = parseHMS($("#c-time").value); if(!total){ out.innerHTML = `<div class="card p-4 text-sm text-slate-500">請輸入總時間（例如 19:49 或 1:27:00）或配速。</div>`; return; } pace = total/(dist/1000); $("#c-pace").value = fmtPace(pace); }
  else { pace = parseHMS($("#c-pace").value); if(!pace){ out.innerHTML = `<div class="card p-4 text-sm text-slate-500">請輸入配速（例如 4:07）。</div>`; return; } total = pace*dist/1000; $("#c-time").value = fmtTime(total); }
  const v_mmin = dist/(total/60);
  const vdot = vdotFromRace(dist, total);
  const pct = pctMax(total/60);
  const vo2cost = vo2At(v_mmin);

  while(dist/seg > 300) seg *= 5;  // keep the split table bounded
  const n = Math.floor(dist/seg + 1e-9), rem = dist - n*seg;
  const rows = []; let cum=0;
  for(let i=1;i<=n;i++){ cum += seg; rows.push([cum, pace*seg/1000, pace*cum/1000]); }
  if(rem>1){ cum += rem; rows.push([cum, pace*rem/1000, pace*cum/1000]); }

  const neg = rows.map((r,i)=>{ const f=i/rows.length; const adj = f<1/3? 1.02 : f<2/3? 1.0 : 0.98; return r[1]*adj; });

  const scale = total/negCum; // normalise to same total
  const equiv = [["1500 m",1500],["3 km",3000],["5 km",5000],["10 km",10000],["半馬",21097.5],["全馬",42195]].map(e=>[e[0], raceTimeFor(vdot,e[1]), raceTimeFor(vdot,e[1])/(e[1]/1000)]);
  const tp = {E_slow:paceAtFrac(vdot,0.62), E_fast:paceAtFrac(vdot,0.72), M:paceAtFrac(vdot,0.82), T:paceAtFrac(vdot,0.88), I:paceAtFrac(vdot,1.00), R:paceAtFrac(vdot,1.08)};

  <div class="font-black text-lg">🔜 未來賽事：目標與策略</div>
  ${fut.map(r=>`<div class="card p-5 stripe" style="border-color:${r.priority==="A"?"#f97316":"#0ea5e9"}">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><div class="text-xs text-slate-500 font-bold">${r.date} ${r.weekday} · <span class="badge ${prio(r.priority)}">${r.priority} 級</span></div><div class="font-black text-xl">${esc(r.name)}</div><div class="text-sm text-slate-600">${r.distance_km} km · 距今 ${r.days_left} 天${r.weeks_to_goal>0?` · 距東京 ${r.weeks_to_goal} 週`:""}</div></div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-orange-50 rounded-xl p-2"><div class="text-[10px] text-slate-500">目標 A</div><div class="font-black font-mono">${r.goal_a||"-"}</div><div class="text-[11px] font-mono text-slate-600">${r.pace_a||"-"}/km · 400m ${r.pace_a_400||"-"}</div></div>
        <div class="bg-sky-50 rounded-xl p-2"><div class="text-[10px] text-slate-500">目標 B</div><div class="font-black font-mono">${r.goal_b||"-"}</div><div class="text-[11px] font-mono text-slate-600">${r.pace_b||"-"}/km · 400m ${r.pace_b_400||"-"}</div></div>
        <div class="bg-slate-50 rounded-xl p-2"><div class="text-[10px] text-slate-500">目前 VDOT ${D.athlete.vdot} 推估</div><div class="font-black font-mono">${r.pred_time||"-"}</div><div class="text-[11px] font-mono text-slate-600">${r.pred_pace||"-"}/km</div></div>
      </div>
    </div>
    <div class="mt-3 text-sm text-slate-700 leading-relaxed"><div class="font-bold text-slate-800 mb-1">🎯 比賽策略</div>${para(r.strategy)}</div>
    ${r.plan_effect?`<div class="mt-2 text-sm bg-amber-50 border border-amber-200 rounded-xl p-3"><b>📅 對課表的影響：</b>${esc(r.plan_effect)}</div>`:""}
  </div>`).join("")}
  <div class="font-black text-lg">📜 過去賽事：成績與檢討</div>
  ${past.map(r=>`<div class="card p-5 stripe" style="border-color:#94a3b8">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><div class="text-xs text-slate-500 font-bold">${r.date} ${r.weekday} · <span class="badge ${prio(r.priority)}">${r.priority} 級</span></div><div class="font-black text-xl">${esc(r.name)}</div></div>
      <div class="flex flex-wrap gap-2 text-center">
        ${[["成績",r.result_time],["距離",r.result_distance_km?r.result_distance_km+" km":null],["配速",r.result_pace?r.result_pace+"/km":null],["平均心率",r.result_hr?r.result_hr+" bpm":null],["VDOT",r.vdot],["等值半馬",r.equiv_hm]].filter(x=>x[1]).map(x=>`<div class="bg-slate-50 rounded-xl px-3 py-2"><div class="text-[10px] text-slate-500">${x[0]}</div><div class="font-black font-mono">${x[1]}</div></div>`).join("")}
      </div>
    </div>
    ${(r.legs||[]).length>1?`<div class="mt-2 text-xs text-slate-600">${r.legs.map((l,i)=>`第 ${i+1} 棒 ${esc(l.location||"")} ${l.start_local?l.start_local.slice(11):""}：${l.distance_km} km · ${l.pace}/km · ${l.avg_hr||"-"} bpm`).join(" ｜ ")}</div>`:""}
    ${(r.legs||[]).length===1?`<div class="mt-2 text-xs text-slate-600 flex flex-wrap gap-x-4">${[["起跑",r.legs[0].start_local],["步頻",r.legs[0].cadence?Math.round(r.legs[0].cadence)+" spm":null],["步幅",r.legs[0].stride_m?r.legs[0].stride_m+" m":null],["最快 1 km",r.legs[0].best_km],["爬升",r.legs[0].elev_gain!=null?"+"+Math.round(r.legs[0].elev_gain)+" m":null],["訓練負荷",r.legs[0].training_load],["TE",r.legs[0].aerobic_te?r.legs[0].aerobic_te+"/"+r.legs[0].anaerobic_te:null]].filter(x=>x[1]).map(x=>`<span><span class="text-slate-400">${x[0]}</span> ${x[1]}</span>`).join("")}</div>`:""}
    <div class="mt-3 text-sm text-slate-700 leading-relaxed"><div class="font-bold text-slate-800 mb-1">🧑‍🏫 教練檢討</div>${para(r.review)}</div>
    ${(r.lessons||[]).length?`<div class="mt-2 text-sm bg-sky-50 border border-sky-200 rounded-xl p-3"><b>📌 帶走的教訓：</b><ul class="list-disc pl-5 mt-1">${r.lessons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${(r.legs||[]).some(l=>D.workouts.find(w=>w.labelId===l.labelId))?`<button onclick="openWorkout('${r.legs.find(l=>D.workouts.find(w=>w.labelId===l.labelId)).labelId}')" class="mt-3 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-bold">📈 路線 / 圖表</button>`:""}
  </div>`).join("")}`;
}

// ------------------------------------------------------------ password gate (教練室 Q&A + 跑姿分析)
// data.json carries these sections only as an AES-256-GCM blob (key = PBKDF2-SHA256 of the password); decrypted in-browser.
const LOCKED_TABS = ["chat","form"];
let UNLOCKED = false;
const isLocked = () => !!(D && D.locked) && !UNLOCKED;
async function unlockWith(pw){
  const L = D.locked; if(!L) return;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(L.salt), iterations:L.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.iv)}, key, b64(L.ct));
  const obj = JSON.parse(new TextDecoder().decode(pt));
  D.chat_log = obj.chat_log || []; D.form_reviews = obj.form_reviews || []; D.ask = obj.ask || null;
}
async function autoUnlock(){
  if(!D.locked){ UNLOCKED = true; return; }
  const pw = sessionStorage.getItem("hm_key") || localStorage.getItem("hm_key");
  if(!pw) return;
  try{ await unlockWith(pw); UNLOCKED = true; }catch(e){ sessionStorage.removeItem("hm_key"); localStorage.removeItem("hm_key"); }
}
async function tryUnlock(pw, remember){
  try{ await unlockWith(pw); }catch(e){ return false; }
  UNLOCKED = true; (remember ? localStorage : sessionStorage).setItem("hm_key", pw); if(!remember) localStorage.removeItem("hm_key");
  renderLockState(); renderChat(); renderFormTab(); return true;
}
function lockAgain(){ UNLOCKED = false; sessionStorage.removeItem("hm_key"); localStorage.removeItem("hm_key"); if(D){ D.chat_log = []; D.form_reviews = []; D.ask = null; } clearTimeout(ASK.timer); ASK.threads = []; ASK.comments = {}; renderLockState(); renderChat(); renderFormTab(); }
function renderLockState(){ $$("#tabs button").forEach(b => { if(LOCKED_TABS.includes(b.dataset.tab)) b.textContent = b.textContent.replace(/[🔒🔓]/gu, "").trim() + (D && D.locked ? (UNLOCKED ? " 🔓" : " 🔒") : ""); }); }
function gateHTML(tab){
  return `<div class="card p-6 max-w-md mx-auto text-center fade-in"><div class="text-4xl">🔒</div><div class="font-black text-lg mt-2">${tab==="chat" ? "教練室 Q&amp;A" : "跑姿分析"} 需要密碼</div><div class="text-sm text-slate-600 mt-1">這兩個分頁的內容在網站上只以加密形式存在，輸入密碼後在你的瀏覽器內解密。</div>
    <form class="mt-4 flex flex-col gap-2 items-center" onsubmit="event.preventDefault(); submitGate(this)"><input name="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="密碼" class="border rounded-xl px-4 py-2 text-center text-lg w-56" autofocus><label class="text-xs text-slate-500"><input type="checkbox" name="remember" checked> 記住這台裝置</label><button class="px-5 py-2 rounded-xl bg-slate-900 text-white font-bold">解鎖</button><div class="text-xs text-rose-600 gate-err"></div></form></div>`;
}
async function submitGate(form){ if(!(window.crypto && crypto.subtle)){ form.querySelector(".gate-err").textContent = "此瀏覽器無法解密（需要 https 與 WebCrypto）"; return; } const ok = await tryUnlock(form.pw.value.trim(), form.remember.checked); if(!ok){ form.querySelector(".gate-err").textContent = "密碼錯誤"; form.pw.value = ""; form.pw.focus(); } }
function renderFormTab(){
  const el = $("#tab-form"); if(!el) return;
  if(isLocked()){ el.innerHTML = gateHTML("form"); return; }
  if(typeof FORM !== "undefined" && FORM.renderFormTab) FORM.renderFormTab(); else el.innerHTML = '<div class="card p-6 text-rose-600">跑姿分析模組 (form.js) 載入失敗，請重新整理。</div>';
}

// ------------------------------------------------------------ web ask box (private GitHub inbox; token lives only inside the password-locked blob)
// One issue per question; the coach answers with a robot-prefixed comment and closes the issue. Open issue = waiting for the coach.
const ASK = {threads:[], comments:{}, loading:false, sending:false, err:null, note:"", timer:null, lastLoad:0};
const askCfg = () => (D && D.ask && D.ask.token && D.ask.repo) ? D.ask : null;
const chatTabOpen = () => { const t = $("#tab-chat"); return !!t && !t.classList.contains("hidden"); };
async function askApi(path, opt){
  const c = askCfg(); if(!c) throw new Error("尚未啟用");
  const o = Object.assign({cache:"no-store"}, opt||{}); o.headers = Object.assign({Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json"}, (opt && opt.headers)||{});
  const r = await fetch("https://api.github.com/repos/"+c.repo+path, o);
  if(!r.ok) throw new Error(r.status===401 ? "金鑰失效 (401)" : r.status===403 ? "GitHub 暫時拒絕 (403)" : "GitHub "+r.status);
  return r.json();
}
async function askLoad(){
  if(!askCfg() || ASK.loading) return; ASK.loading = true;
  try{
    const issues = (await askApi("/issues?state=all&sort=created&direction=desc&per_page=12")).filter(i=>!i.pull_request);
    for(const it of issues){ const c = ASK.comments[it.number]; if(it.comments > 0 && !(c && c.u === it.updated_at)) ASK.comments[it.number] = {u:it.updated_at, list: await askApi("/issues/"+it.number+"/comments?per_page=50")}; }
    const fresh = ASK.threads.filter(t=> t.state==="open" && !issues.some(i=>i.number===t.number) && Date.now() - new Date(t.created_at).getTime() < 90000); // GitHub's list lags a few seconds behind a new issue
    ASK.threads = fresh.concat(issues); ASK.err = null;
  }catch(e){ ASK.err = "讀取失敗：" + (e.message||e); }
  ASK.loading = false; ASK.lastLoad = Date.now(); renderAsk(); askSchedule();
}
function askSchedule(){ clearTimeout(ASK.timer); ASK.timer = null; if(askCfg() && chatTabOpen() && ASK.threads.some(t=>t.state==="open")) ASK.timer = setTimeout(askLoad, 15000); }
async function askSend(){
  const ta = $("#ask-text"); if(!ta || ASK.sending) return; const text = (ta.value||"").trim(); if(!text) return;
  if(text.length > 4000){ ASK.err = "問題太長（上限 4000 字），請分段送出"; renderAsk(); return; }
  ASK.sending = true; ASK.err = null; ASK.note = ""; renderAsk();
  try{
    const it = await askApi("/issues", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({title: "Q: " + text.replace(/\s+/g," ").slice(0,60), body: text})});
    ASK.threads = [it].concat(ASK.threads.filter(t=>t.number!==it.number)); ta.value = ""; ASK.note = "已送出，教練回覆後會自動顯示在下方（通常 1–3 分鐘）。";
  }catch(e){ ASK.err = "送出失敗：" + (e.message||e) + "。請稍後再試，或改用 Google Chat 教練室。"; }
  ASK.sending = false; renderAsk(); askSchedule();
}
function askFormHTML(){
  if(!askCfg()) return `<div class="card p-5 text-sm text-slate-600"><b>💬 網頁提問</b>：尚未啟用（等待一次性設定完成）。目前請在 Google Chat 教練室提問。</div>`;
  return `<div class="card p-5 border-2 border-sky-200">
    <div class="font-black text-lg">💬 直接在這裡問教練</div>
    <textarea id="ask-text" rows="3" maxlength="4000" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();askSend();}" placeholder="例：這週六的長跑可以改到週日嗎？／昨天間歇後小腿有點緊，明天怎麼調整？" class="w-full border rounded-xl p-3 text-sm mt-2 focus:outline-none focus:ring-2 focus:ring-sky-300"></textarea>
    <div class="flex flex-wrap items-center gap-3 mt-2"><button id="ask-send" onclick="askSend()" class="px-5 py-2 rounded-xl bg-slate-900 text-white font-bold text-sm">送出</button><span id="ask-status" class="text-xs text-slate-500"></span></div>
    <div class="text-[11px] text-slate-400 mt-2">Ctrl/⌘ + Enter 也可送出。通常 1–3 分鐘內回覆；這個分頁開著時答案會自動出現，之後也會整理進下方紀錄並同步調整課表。影片／照片請改用 Google Chat 教練室上傳。</div>
  </div><div id="ask-threads" class="space-y-3"></div>`;
}
function renderAsk(){
  const st = $("#ask-status"), box = $("#ask-threads"), btn = $("#ask-send"); if(!st || !box) return;
  if(btn){ btn.disabled = ASK.sending; btn.textContent = ASK.sending ? "送出中…" : "送出"; btn.style.opacity = ASK.sending ? .5 : 1; }
  st.innerHTML = ASK.err ? `<span class="text-rose-600">${esc(ASK.err)}</span>` : esc(ASK.note || "");
  const done = new Set((D.chat_log||[]).map(e=>e.issue).filter(x=>x!=null));
  const show = ASK.threads.filter(t=>!done.has(t.number));
  const when = s => { try{ return new Date(s).toLocaleString("zh-TW", {timeZone:"Asia/Taipei", hour12:false, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"}); }catch(e){ return String(s||"").slice(0,16).replace("T"," "); } };
  box.innerHTML = show.map(t=>{ const cs = ((ASK.comments[t.number]||{}).list||[]); const open = t.state==="open";
    return `<div class="card p-5 stripe" style="border-color:${open?"#f59e0b":"#22c55e"}">
      <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500"><span class="font-bold">${esc(when(t.created_at))}</span><span class="badge bg-sky-100 text-sky-700">🌐 網頁提問</span>${open ? '<span class="badge bg-amber-100 text-amber-700 pulse">⏳ 教練回覆中…</span>' : '<span class="badge bg-emerald-100 text-emerald-700">✅ 已回覆</span>'}</div>
      <div class="font-black mt-1 whitespace-pre-line">Q：${esc(t.body || t.title || "")}</div>
      ${cs.map(c=>`<div class="text-sm text-slate-700 mt-2 leading-relaxed whitespace-pre-line ${/^\s*🤖/u.test(c.body||"") ? "" : "pl-3 border-l-2 border-slate-200"}">${esc(String(c.body||"").replace(/^\s*🤖\s*/u, ""))}</div>`).join("")}
    </div>`; }).join("");
}

// ------------------------------------------------------------ coach chat log
function renderChat(){
  if(isLocked()){ $("#tab-chat").innerHTML = gateHTML("chat"); return; }
  const log = D.chat_log||[];
  $("#tab-chat").innerHTML = `
  <div class="card p-5"><div class="font-black text-lg">教練室 Q&A</div>
    <div class="text-sm text-slate-600 mt-1">可以直接在下方輸入問題，或在 Google Chat 教練室提問／上傳跑步影片；教練回覆後會把重點整理到這裡（不受半天同步限制，問完即更新）。</div></div>
  ${askFormHTML()}
  ${log.length? log.map(e=>`<div class="card p-5 stripe" style="border-color:${e.kind==="video"?"#a855f7":"#0ea5e9"}">
      <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500"><span class="font-bold">${esc(e.ts)}</span>${e.kind==="video"?'<span class="badge bg-violet-100 text-violet-700">🎥 影片分析</span>':'<span class="badge bg-sky-100 text-sky-700">💬 問答</span>'}${e.issue!=null?'<span class="badge bg-sky-50 text-sky-700">🌐 網頁提問</span>':""}${(e.tags||[]).map(t=>`<span class="badge bg-slate-100 text-slate-600">#${esc(t)}</span>`).join("")}</div>
      <div class="font-black mt-1">Q：${esc(e.question)}</div>
      <div class="text-sm text-slate-700 mt-2 leading-relaxed whitespace-pre-line">${esc(e.answer)}</div>
      ${e.insights&&e.insights.length?`<div class="mt-3 text-sm bg-amber-50 border border-amber-200 rounded-xl p-3"><b>📌 重點／對課表的影響：</b><ul class="list-disc pl-5 mt-1">${e.insights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    </div>`).join("") : `<div class="card p-6 text-sm text-slate-500">尚無討論紀錄。</div>`}`;
  renderAsk(); if(askCfg() && chatTabOpen() && Date.now() - ASK.lastLoad > 5000) askLoad();
}

// ------------------------------------------------------------ method
function renderMethod(){
  $("#tab-method").innerHTML = `
  <div class="grid md:grid-cols-2 gap-4">${D.methodology.map(m=>`<div class="card p-5"><div class="font-black text-lg">${m.icon} ${esc(m.name)}</div><p class="text-sm text-slate-700 leading-relaxed mt-2">${esc(m.text)}</p></div>`).join("")}</div>
  <div class="card p-5"><div class="font-black text-lg mb-2">名詞速查</div><dl class="kv text-sm">
    <dt>跑休</dt><dd>組間以非常慢的慢跑（約 E 配速 +20～30 秒）恢復，不停下來。優點：維持攝氧量在高檔、下一趟更快進入狀態；適合 ≥600 m 的間歇與所有閾值課。</dd>
    <dt>停休</dt><dd>組間站立或走動。適合 ≤400 m 的短間歇、R 配速反覆跑與大步跑，讓每一趟都能維持速度品質。</dd>
    <dt>等時跑休</dt><dd>跑多久就慢跑多久（例：800 m 跑 3:00，就慢跑 3:00）。</dd>
    <dt>HMP</dt><dd>半馬目標配速。本計畫從目前實力對應的半馬配速逐週逼近 4:07（87 分）；每次新增訓練後重算。</dd>
    <dt>T / I / R</dt><dd>Daniels 閾值 / 間歇 (VO2max) / 反覆 (速度) 配速。</dd>
    <dt>心率漂移</dt><dd>同一配速下後半段心率上升的幅度（效率衰退）；<5% 表示該配速對你是可持續的，>10% 表示有氧耐力不足或環境/狀態不佳。</dd>
    <dt>ACWR</dt><dd>急性 (7 天) / 慢性 (28 天平均) 跑量比。0.8–1.3 安全，>1.5 受傷風險顯著上升。</dd>
  </dl></div>`;
}

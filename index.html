<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半馬 87 分計畫 · AI 教練儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f9}
  .tab-btn.active{background:#0f172a;color:#fff}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .stripe{border-left:5px solid}
  .modal-bg{background:rgba(15,23,42,.6);backdrop-filter:blur(3px)}
  #map{height:300px;border-radius:12px;z-index:0}
  .scrollbar-thin::-webkit-scrollbar{height:6px;width:6px}.scrollbar-thin::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
  details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
  .kv dt{color:#64748b;white-space:nowrap}.kv dd{color:#0f172a}
  .star{color:#f59e0b}
  .pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .fade-in{animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="text-slate-800">
<header class="bg-slate-900 text-white">
  <div class="max-w-7xl mx-auto px-4 py-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <div class="text-xs tracking-widest text-orange-300 font-bold">HALF MARATHON · 2027/01/10</div>
        <h1 class="text-2xl md:text-3xl font-black">半馬 87 分計畫 <span class="text-slate-400 font-medium text-lg">AI 科學化教練儀表板</span></h1>
      </div>
      <div class="text-right">
        <div id="countdown" class="text-3xl font-black text-orange-400">—</div>
        <div class="text-xs text-slate-400">資料更新 <span id="updated">—</span> · 最後同步檢查 <span id="synced">—</span></div>
        <div class="text-[11px] text-slate-500" id="schedule-note"></div>
      </div>
    </div>
    <nav class="mt-4 flex gap-2 overflow-x-auto scrollbar-thin pb-1" id="tabs">
      <button data-tab="overview" class="tab-btn active whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">總覽</button>
      <button data-tab="plan" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">訓練課表 (8 週)</button>
      <button data-tab="history" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">訓練紀錄 (20)</button>
      <button data-tab="weekly" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">週統計 (8 週)</button>
      <button data-tab="tech" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">技術分析</button>
      <button data-tab="calc" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">配速計算</button>
      <button data-tab="wellness" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">身體狀態</button>
      <button data-tab="chat" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">教練室 Q&A</button>
      <button data-tab="method" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full bg-slate-800 text-sm font-bold">訓練方法論</button>
    </nav>
  </div>
</header>

<div id="notify" class="hidden max-w-7xl mx-auto px-4 mt-4"></div>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <section id="tab-overview" class="tab space-y-6"></section>
  <section id="tab-plan" class="tab hidden space-y-6"></section>
  <section id="tab-history" class="tab hidden space-y-6"></section>
  <section id="tab-weekly" class="tab hidden space-y-6"></section>
  <section id="tab-tech" class="tab hidden space-y-6"></section>
  <section id="tab-calc" class="tab hidden space-y-6"></section>
  <section id="tab-wellness" class="tab hidden space-y-6"></section>
  <section id="tab-chat" class="tab hidden space-y-6"></section>
  <section id="tab-method" class="tab hidden space-y-6"></section>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 modal-bg overflow-y-auto" onclick="if(event.target===this)closeModal()">
  <div class="max-w-5xl mx-auto my-6 bg-white rounded-2xl shadow-2xl p-5 md:p-7 fade-in" id="modal-body"></div>
</div>

<footer class="text-center text-xs text-slate-400 py-8">資料來源：COROS (MCP) · 配速系統：Daniels VDOT · 訓練哲學：Hansons / 挪威式閾值 / 80-20 · 由 AI 教練自動生成與維護</footer>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
let D = null; const charts = {}; let map = null;
const TYPE_LABEL = {recovery:"恢復跑", easy:"輕鬆跑", long:"長距離", progression:"漸速長跑", tempo:"閾值/節奏", interval:"間歇", race:"比賽/測驗", strides:"短程", rest:"休息", other:"其他"};
const TYPE_COLOR = {recovery:"#94a3b8", easy:"#22c55e", long:"#3b82f6", progression:"#6366f1", tempo:"#f97316", interval:"#ef4444", race:"#a855f7", strides:"#cbd5e1", rest:"#e2e8f0", other:"#cbd5e1"};
const STATUS = {hit:["✅ 已完成","bg-emerald-100 text-emerald-700"], partial:["🟡 部分達成","bg-amber-100 text-amber-700"], diff:["🔁 內容不同","bg-sky-100 text-sky-700"], missed:["❌ 未執行","bg-rose-100 text-rose-700"], rest_ok:["✔ 休息","bg-slate-100 text-slate-500"], today:["📍 今天","bg-orange-500 text-white pulse"], today_done:["📍 今天 ✅","bg-emerald-500 text-white"], upcoming:["",""]};
const fmtPace = s => (s==null||!isFinite(s)||s<=0) ? "-" : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
const fmtTime = s => { if(s==null) return "-"; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const stars = n => '<span class="star">'+"★".repeat(n)+'</span><span class="text-slate-300">'+"★".repeat(5-n)+'</span>';
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b? Math.round(a/b*100):0;

function mkChart(id, cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(!el) return; charts[id]=new Chart(el, cfg); }

// ------------------------------------------------------------ tabs
$$("#tabs button").forEach(b=>b.onclick=()=>{ $$("#tabs button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); $$(".tab").forEach(t=>t.classList.add("hidden")); $("#tab-"+b.dataset.tab).classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"}); if(b.dataset.tab==="weekly") renderWeeklyCharts(); if(b.dataset.tab==="overview") renderOverviewCharts(); if(b.dataset.tab==="wellness") renderWellnessCharts(); if(b.dataset.tab==="tech") renderTechCharts(); if(b.dataset.tab==="calc") calcRun(); });

// ------------------------------------------------------------ load
fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{ D=d; renderAll(); }).catch(e=>{ $("#tab-overview").innerHTML = `<div class="card p-6 text-rose-600">資料載入失敗：${esc(e)}</div>`; });

function renderAll(){
  $("#updated").textContent = D.generated_at;
  $("#synced").textContent = D.last_sync_at || D.generated_at;
  $("#schedule-note").textContent = D.sync_schedule || "";
  $("#countdown").textContent = `距離比賽 ${D.race.days_left} 天`;
  if(D.notify && D.notify.length){ $("#notify").classList.remove("hidden"); $("#notify").innerHTML = `<div class="card p-4 border-l-4 border-emerald-500 flex items-start gap-3"><div class="text-2xl">🆕</div><div><div class="font-bold">已更新訓練 (${D.generated_at})</div><div class="text-sm text-slate-600">新增 ${D.notify.length} 筆：${D.notify.map(n=>esc(n)).join("、")}。課表已依最新數據重新計算。</div></div></div>`; }
  renderOverview(); renderPlan(); renderHistory(); renderWeekly(); renderWellness(); renderMethod(); renderTech(); renderCalc(); renderChat();
  renderOverviewCharts();
}

// ------------------------------------------------------------ overview
function renderOverview(){
  const a = D.athlete, r = D.race, p = D.plan;
  const cur = p.weeks[0];
  const todayStr = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
  const todayDay = cur.days.find(x=>x.date===todayStr) || cur.days[0];
  const nextDay = cur.days.find(x=>x.date>todayStr && x.session.type!=="rest") || (p.weeks[1]||cur).days.find(x=>x.session.type!=="rest");
  const kpi = (label, val, sub, color="text-slate-900") => `<div class="card p-4"><div class="text-xs text-slate-500 font-bold">${label}</div><div class="text-2xl font-black ${color} mt-1">${val}</div><div class="text-xs text-slate-500 mt-1">${sub||""}</div></div>`;
  $("#tab-overview").innerHTML = `
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
    ${kpi("目標 A", r.goal_A, `配速 ${r.goal_A_pace}/km · 需 VDOT ${r.goal_A_vdot}`, "text-orange-600")}
    ${kpi("目標 B (底線)", r.goal_B, `配速 ${r.goal_B_pace}/km · 需 VDOT ${r.goal_B_vdot}`, "text-amber-600")}
    ${kpi("目前 VDOT", a.vdot, `推估半馬 ${a.pred_hm}${a.coros_hm_pred? " · COROS 預測 "+a.coros_hm_pred:""}`, "text-sky-700")}
    ${kpi("與目標差距", `${a.gap_B>0?"+":""}${a.gap_B} / ${a.gap_A>0?"+":""}${a.gap_A}`, "VDOT：破 90 / 破 87", a.gap_B<=0.3?"text-emerald-600":"text-rose-600")}
    ${kpi("本週跑量", `${cur.actual_km} <span class="text-base text-slate-400">/ ${cur.target_km} km</span>`, `${cur.phase} · 計畫 ${cur.planned_km} km`)}
    ${kpi("急慢性負荷比 ACWR", p.acwr??"-", p.acwr==null?"資料不足": p.acwr>1.4?"⚠️ 偏高，注意降載": p.acwr<0.8?"偏低（恢復/減量中）":"✅ 安全區 0.8–1.3", p.acwr>1.4?"text-rose-600":"text-emerald-600")}
  </div>
  <div class="card p-5 border-l-4 border-sky-500">
    <div class="font-black text-lg mb-1">🎯 教練總評</div>
    <p class="text-slate-700 leading-relaxed">${esc(a.verdict)}</p>
    <p class="text-xs text-slate-500 mt-2">VDOT 由近 8 週 ${a.n_samples} 筆「配速 × 心率儲備」推估${a.coros_vo2max? "，並與 COROS VO2max "+a.coros_vo2max+" 加權":""}；HRmax ${a.hrmax} bpm、靜止心率 ${a.hrrest} bpm。12/13 的 10K 測驗會提供最準確的校準。</p>
  </div>
  ${sleepWarn(D.wellness||{})}
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="space-y-5">
      ${dayCard(todayDay, cur, true)}
      ${nextDay && nextDay!==todayDay ? `<div class="text-xs font-bold text-slate-500 -mb-3 ml-1">下一堂課</div>${dayCard(nextDay, cur, false)}`:""}
    </div>
    <div class="space-y-5">
      <div class="card p-5"><div class="font-black mb-2">近 8 週跑量與平均配速</div><canvas id="ch-vol" height="170"></canvas></div>
      <div class="card p-5"><div class="font-black mb-2">VDOT 推估趨勢（各次訓練樣本）</div><canvas id="ch-vdot" height="130"></canvas></div>
    </div>
  </div>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="card p-5">
      <div class="font-black mb-3">本週訓練配速表 (VDOT ${cur.vdot_k})</div>
      <table class="w-full text-sm"><tbody>
        ${[["E 輕鬆", cur.paces.E_slow+" – "+cur.paces.E_fast, "有氧底座、恢復；Z1–Z2"],["M 馬拉松", cur.paces.M, "穩態有氧上緣；長跑末段"],["HMP 半馬目標", cur.hmp, "本週專項配速 (逐週逼近 "+r.goal_A_pace+")"],["T 閾值", cur.paces.T, "乳酸閾值；挪威式 sub-T 上限"],["10K", cur.paces.K10_pace, "10K 配速 / 1000 m 間歇"],["I 間歇", cur.paces.I, "VO2max；跑班 400–1200 m"],["R 反覆", cur.paces.R, "速度/經濟性；200–400 m"]].map(x=>`<tr class="border-b border-slate-100"><td class="py-1.5 font-bold">${x[0]}</td><td class="py-1.5 font-mono text-right text-sky-700 font-bold">${x[1]}</td><td class="py-1.5 text-xs text-slate-500 pl-3">${x[2]}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="card p-5">
      <div class="font-black mb-3">心率區間 (HRmax ${a.hrmax})</div>
      <div class="space-y-2">${a.zones.map((z,i)=>`<div class="flex items-center gap-3 text-sm"><div class="w-16 font-bold">${z.name}</div><div class="flex-1 h-3 rounded-full" style="background:${["#94a3b8","#22c55e","#f59e0b","#f97316","#ef4444"][i]};opacity:.85"></div><div class="w-28 text-right font-mono">${z.lo}${i===4?"+":" – "+z.hi} bpm</div></div>`).join("")}</div>
      <div class="text-xs text-slate-500 mt-3">閾值課請以 Z3 上緣～Z4（${Math.round(a.hrmax*0.86)}–${Math.round(a.hrmax*0.91)}）為上限；輕鬆日 < ${Math.round(a.hrmax*0.80)}。</div>
    </div>
  </div>
  <div class="card p-5"><div class="font-black mb-2">12 週週期總覽</div><canvas id="ch-period" height="110"></canvas></div>`;
}

function renderOverviewCharts(){
  if(!D) return;
  const W = D.weekly;
  mkChart("ch-vol", {type:"bar", data:{labels:W.map(w=>w.label), datasets:[
    {label:"戶外 km", data:W.map(w=>w.outdoor_km), backgroundColor:"#3b82f6", stack:"a", yAxisID:"y"},
    {label:"室內 km", data:W.map(w=>w.indoor_km), backgroundColor:"#93c5fd", stack:"a", yAxisID:"y"},
    {label:"平均配速", data:W.map(w=>w.pace_s? w.pace_s/60:null), type:"line", borderColor:"#f97316", backgroundColor:"#f97316", yAxisID:"y2", tension:.3, spanGaps:true}]},
    options:{responsive:true, interaction:{mode:"index"}, plugins:{legend:{position:"bottom"}, tooltip:{callbacks:{label:c=> c.dataset.yAxisID==="y2"? "配速 "+fmtPace(c.raw*60)+"/km" : c.dataset.label+" "+c.raw+" km"}}},
      scales:{y:{title:{display:true,text:"km"}, stacked:true}, y2:{position:"right", reverse:true, grid:{drawOnChartArea:false}, ticks:{callback:v=>fmtPace(v*60)}, title:{display:true,text:"配速 /km"}}}}});
  const S = D.athlete.vdot_samples||[];
  mkChart("ch-vdot", {type:"scatter", data:{datasets:[{label:"單次推估 VDOT", data:S.map(s=>({x:s.date, y:s.vdot})), backgroundColor:"#0ea5e9"},
      {label:"採用值", data:S.length? [{x:S[0].date,y:D.athlete.vdot},{x:S[S.length-1].date,y:D.athlete.vdot}]:[], type:"line", borderColor:"#0f172a", borderDash:[6,4], pointRadius:0},
      {label:"破 90 需求", data:S.length? [{x:S[0].date,y:D.race.goal_B_vdot},{x:S[S.length-1].date,y:D.race.goal_B_vdot}]:[], type:"line", borderColor:"#f59e0b", pointRadius:0},
      {label:"破 87 需求", data:S.length? [{x:S[0].date,y:D.race.goal_A_vdot},{x:S[S.length-1].date,y:D.race.goal_A_vdot}]:[], type:"line", borderColor:"#ef4444", pointRadius:0}]},
    options:{plugins:{legend:{position:"bottom"}}, scales:{x:{type:"category", labels:S.map(s=>s.date)}, y:{title:{display:true,text:"VDOT"}}}}});
  const PW = D.plan.weeks;
  const phaseColor = {build:"#3b82f6", absorb:"#94a3b8", specific:"#f97316", test:"#a855f7", peak:"#ef4444", taper:"#22c55e", race:"#f59e0b"};
  mkChart("ch-period", {type:"bar", data:{labels:PW.map(w=>`W${w.k} ${w.label.split(" ~ ")[0]}`), datasets:[{label:"目標跑量", data:PW.map(w=>w.target_km), backgroundColor:PW.map(w=>phaseColor[w.phase_key]||"#999")},{label:"實際", data:PW.map(w=>w.actual_km||null), type:"line", borderColor:"#0f172a", pointBackgroundColor:"#0f172a"}]},
    options:{plugins:{legend:{display:false}, tooltip:{callbacks:{afterLabel:c=>PW[c.dataIndex].phase}}}, scales:{y:{title:{display:true,text:"km / 週"}}}}});
}

// ------------------------------------------------------------ plan
function restBadge(rest){ if(!rest) return ""; const jog = /跑休/.test(rest), stand = /停休|走/.test(rest); return `<span class="badge ${jog?"bg-sky-100 text-sky-700":stand?"bg-amber-100 text-amber-700":"bg-slate-100 text-slate-600"}">${jog&&stand?"跑休/停休":jog?"跑休":stand?"停休":"休息"}</span>`; }
function dayCard(day, week, big){
  const s = day.session, st = STATUS[day.status]||["",""];
  const color = TYPE_COLOR[s.type]||"#cbd5e1";
  const actual = (day.actual||[]).map(a=>`<div class="mt-2 text-xs bg-slate-50 rounded-lg p-2 flex flex-wrap items-center gap-2 cursor-pointer hover:bg-slate-100" onclick="openWorkout('${a.labelId}')"><span class="badge" style="background:${TYPE_COLOR[a.type]}22;color:${TYPE_COLOR[a.type]}">${a.indoor?"🏠":"🌳"} 實際 · ${a.type_label}</span><span>${a.distance_km} km · ${a.pace}/km · ${a.avg_hr||"-"} bpm</span><span class="text-sky-600 font-bold ml-auto">查看 →</span></div>`).join("");
  const body = `
    <dl class="kv mt-3">
      <dt>練習重點</dt><dd class="font-bold">${esc(s.purpose)}</dd>
      ${s.warmup?`<dt>熱身</dt><dd>${esc(s.warmup)}</dd>`:""}
      <dt>主課表</dt><dd>${esc(s.main)}</dd>
      ${s.rest?`<dt>組間休息</dt><dd>${restBadge(s.rest)} ${esc(s.rest)}</dd>`:""}
      ${s.cooldown?`<dt>收操</dt><dd>${esc(s.cooldown)}</dd>`:""}
      ${s.target_pace?`<dt>目標配速</dt><dd class="font-mono text-sky-700 font-bold">${esc(s.target_pace)}</dd>`:""}
      ${s.target_hr?`<dt>目標心率</dt><dd class="font-mono">${esc(s.target_hr)}</dd>`:""}
      ${s.method?`<dt>方法來源</dt><dd><span class="badge bg-violet-100 text-violet-700">${esc(s.method)}</span></dd>`:""}
    </dl>
    ${s.challenge?`<div class="mt-3 rounded-xl border border-orange-200 overflow-hidden text-xs">
      <div class="flex">
        <div class="flex-1 px-3 py-1.5 bg-slate-100 font-bold text-slate-600">🟢 標準版（上方內容）</div>
        <div class="flex-1 px-3 py-1.5 bg-orange-50 font-bold text-orange-700">🔥 挑戰版（狀態好時可選）</div>
      </div>
      <div class="p-3 bg-orange-50/50">
        <div class="font-bold text-orange-800">${esc(s.challenge.title)}</div>
        <div class="text-slate-700 mt-0.5">${esc(s.challenge.change)}${s.challenge.est_delta_km?` （約 +${s.challenge.est_delta_km} km）`:""}</div>
        ${s.challenge.note?`<div class="text-slate-600 mt-1">※ ${esc(s.challenge.note)}</div>`:""}
        <details class="mt-1"><summary class="text-orange-700 font-bold">挑戰前提（點開）</summary><div class="text-slate-600 mt-1 leading-relaxed">${esc(s.challenge.guard)}</div></details>
      </div></div>`:""}
    ${s.notes&&s.notes.length?`<div class="mt-3 text-xs"><div class="font-bold text-slate-600 mb-1">📝 注意事項</div><ul class="list-disc pl-4 space-y-0.5 text-slate-600">${s.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
    ${s.cautions&&s.cautions.length?`<div class="mt-2 text-xs"><div class="font-bold text-rose-600 mb-1">⚠️ 警示</div><ul class="list-disc pl-4 space-y-0.5 text-rose-700">${s.cautions.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}`;
  return `<div class="card stripe p-4 ${big?"":"text-sm"}" style="border-color:${color}">
    <div class="flex items-start justify-between gap-2">

function sleepWarn(w){

// ------------------------------------------------------------ pace calculator (all formulas client-side; Daniels/Gilbert)
const DIST = [["400 m",400],["800 m",800],["1 km",1000],["1600 m / 英里",1609.34],["3 km",3000],["5 km",5000],["10 km",10000],["15 km",15000],["半馬 21.0975 km",21097.5],["全馬 42.195 km",42195],["自訂",0]];
const vo2At = v => -4.60 + 0.182258*v + 0.000104*v*v;                     // v in m/min
const pctMax = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t); // t in min
const velForVo2 = vo2 => (-0.182258 + Math.sqrt(0.182258*0.182258 + 4*0.000104*(4.6+vo2)))/(2*0.000104);
const vdotFromRace = (d, s) => { const t=s/60, v=d/t; return vo2At(v)/pctMax(t); };
const raceTimeFor = (vdot, d) => { let t=d/200; for(let i=0;i<80;i++){ const v=velForVo2(vdot*pctMax(t)); const tn=d/v; if(Math.abs(tn-t)<1e-5){t=tn;break;} t=tn;} return t*60; };
const paceAtFrac = (vdot, f) => 1000/velForVo2(vdot*f)*60;  // s/km
function parseHMS(str){ if(!str) return null; const p=str.trim().split(":").map(Number); if(p.some(isNaN)) return null; if(p.length===3) return p[0]*3600+p[1]*60+p[2]; if(p.length===2) return p[0]*60+p[1]; return p[0]; }

let calcMode = "time";
function calcPreset(d, t){ $("#c-dist").value = d; if(t){ $("#c-time").value = t; $("#c-pace").value=""; calcMode="time"; } else { $("#c-pace").value = D.athlete.paces.I; $("#c-time").value=""; calcMode="pace"; } calcRun(); }
function calcRun(){
  const out = $("#c-out"); if(!out) return;
  let dist = +$("#c-dist").value; if(!dist) dist = +($("#c-custom").value||0); if(!dist){ out.innerHTML=""; return; }
  let total, pace;
  if(calcMode==="time"){ total = parseHMS($("#c-time").value); if(!total){ out.innerHTML = `<div class="card p-4 text-sm text-slate-500">請輸入總時間（例如 19:49 或 1:27:00）或配速。</div>`; return; } pace = total/(dist/1000); $("#c-pace").value = fmtPace(pace); }
  else { pace = parseHMS($("#c-pace").value); if(!pace){ out.innerHTML = `<div class="card p-4 text-sm text-slate-500">請輸入配速（例如 4:07）。</div>`; return; } total = pace*dist/1000; $("#c-time").value = fmtTime(total); }
  const v_mmin = dist/(total/60);
  const vdot = vdotFromRace(dist, total);
  const pct = pctMax(total/60);
  const vo2cost = vo2At(v_mmin);
  const lap400 = pace*0.4, lap200 = pace*0.2, lap100 = pace*0.1, mile = pace*1.60934;

  if(!(dist>0) || !isFinite(dist) || dist>100000){ out.innerHTML = `<div class="card p-4 text-sm text-rose-600">距離無效。</div>`; return; }
  while(dist/seg > 300) seg *= 5;  // keep the split table bounded
  const n = Math.floor(dist/seg + 1e-9), rem = dist - n*seg;
  const rows = []; let cum=0;
  for(let i=1;i<=n;i++){ cum += seg; rows.push([cum, pace*seg/1000, pace*cum/1000]); }
  if(rem>1){ cum += rem; rows.push([cum, pace*rem/1000, pace*cum/1000]); }
  // negative split suggestion: first 1/3 +2%, middle 0, last 1/3 -2%
  const neg = rows.map((r,i)=>{ const f=i/rows.length; const adj = f<1/3? 1.02 : f<2/3? 1.0 : 0.98; return r[1]*adj; });
  let negCum=0; const negRows = neg.map(x=>{negCum+=x; return negCum;});
  const scale = total/negCum; // normalise to same total
  const equiv = [["1500 m",1500],["3 km",3000],["5 km",5000],["10 km",10000],["半馬",21097.5],["全馬",42195]].map(e=>[e[0], raceTimeFor(vdot,e[1]), raceTimeFor(vdot,e[1])/(e[1]/1000)]);
  const tp = {E_slow:paceAtFrac(vdot,0.62), E_fast:paceAtFrac(vdot,0.72), M:paceAtFrac(vdot,0.82), T:paceAtFrac(vdot,0.88), I:paceAtFrac(vdot,1.00), R:paceAtFrac(vdot,1.08)};
  const vvo2 = 1000/velForVo2(vdot)*60;
  const hrmax = D.athlete.hrmax;
  const effortTxt = pct>0.97? "≈ 1500–3000 m 比賽強度（> 97% VO2max）" : pct>0.93? "≈ 5K 比賽強度（I 區以上）" : pct>0.88? "≈ 10K 比賽強度（T～I 之間）" : pct>0.84? "≈ 半馬比賽／閾值強度" : pct>0.78? "≈ 馬拉松配速強度" : "≈ 有氧穩態／輕鬆強度";
  out.innerHTML = `
  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
    ${[["總時間",fmtTime(total)],["平均配速",fmtPace(pace)+" /km"],["每英里",fmtPace(mile)+" /mi"],["操場一圈 400 m",fmtPace(lap400)],["200 m / 100 m",fmtPace(lap200)+" / "+Math.round(lap100)+"s"],["速度",(v_mmin*0.06).toFixed(2)+" km/h"]].map(x=>`<div class="card p-3 text-center"><div class="text-[11px] text-slate-500 font-bold">${x[0]}</div><div class="text-xl font-black font-mono">${x[1]}</div></div>`).join("")}
  </div>
  <div class="grid lg:grid-cols-3 gap-5 mt-5">
    <div class="card p-5">
      <div class="font-black mb-2">生理對應（把這個表現當成比賽成績）</div>
      <dl class="kv">
        <dt>VDOT</dt><dd class="font-mono font-bold text-sky-700">${vdot.toFixed(1)}</dd>
        <dt>佔 VO2max</dt><dd class="font-mono">${Math.round(pct*100)}% <span class="text-xs text-slate-500">${effortTxt}</span></dd>
        <dt>攝氧成本</dt><dd class="font-mono">${vo2cost.toFixed(1)} ml/kg/min <span class="text-xs text-slate-500">(此速度的氧需求)</span></dd>
        <dt>vVO2max 配速</dt><dd class="font-mono">${fmtPace(vvo2)} /km <span class="text-xs text-slate-500">(I 配速)</span></dd>
        <dt>閾值配速 T</dt><dd class="font-mono font-bold text-orange-600">${fmtPace(tp.T)} /km <span class="text-xs text-slate-500">(400 m ${fmtPace(tp.T*0.4)})</span></dd>
        <dt>馬拉松配速 M</dt><dd class="font-mono">${fmtPace(tp.M)} /km</dd>
        <dt>輕鬆配速 E</dt><dd class="font-mono">${fmtPace(tp.E_fast)}–${fmtPace(tp.E_slow)} /km</dd>
        <dt>反覆配速 R</dt><dd class="font-mono">${fmtPace(tp.R)} /km <span class="text-xs text-slate-500">(400 m ${fmtPace(tp.R*0.4)}, 200 m ${Math.round(tp.R*0.2)}s)</span></dd>
        <dt>間歇配速 I</dt><dd class="font-mono">${fmtPace(tp.I)} /km <span class="text-xs text-slate-500">(400 m ${fmtPace(tp.I*0.4)}, 1000 m ${fmtPace(tp.I)})</span></dd>
        <dt>參考心率</dt><dd class="text-xs">T：${Math.round(hrmax*0.86)}–${Math.round(hrmax*0.91)} · I：${Math.round(hrmax*0.93)}–${Math.round(hrmax*0.98)} · E：&lt;${Math.round(hrmax*0.80)} bpm（HRmax ${hrmax}）</dd>
      </dl>
      <div class="text-xs text-slate-500 mt-2">與你目前的 VDOT ${D.athlete.vdot} 相比：${(vdot-D.athlete.vdot)>=0?"+":""}${(vdot-D.athlete.vdot).toFixed(1)}。</div>
    </div>
    <div class="card p-5">
      <div class="font-black mb-2">同 VDOT 的等值成績</div>
      <table class="w-full text-sm"><thead><tr class="text-slate-500 border-b"><th class="text-left py-1">距離</th><th class="text-right">時間</th><th class="text-right">配速</th></tr></thead><tbody>
      ${equiv.map(e=>`<tr class="border-b border-slate-100"><td class="py-1">${e[0]}</td><td class="text-right font-mono font-bold">${fmtTime(e[1])}</td><td class="text-right font-mono">${fmtPace(e[2])}</td></tr>`).join("")}</tbody></table>
      <div class="text-xs text-slate-500 mt-2">等值成績假設相同的訓練完整度；半馬需要足夠的長跑量才能「兌現」5K 的 VDOT。</div>
    </div>
    <div class="card p-5 overflow-x-auto scrollbar-thin">
      <div class="font-black mb-2">分段配速表（每 ${seg>=1000? seg/1000+" km":seg+" m"}）</div>
      <table class="w-full text-sm font-mono"><thead><tr class="text-slate-500 border-b"><th class="text-left py-1">累計</th><th class="text-right">均速分段</th><th class="text-right">累計時間</th><th class="text-right text-emerald-700">負分割建議</th><th class="text-right text-emerald-700">累計</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr class="border-b border-slate-100 ${i%5===4?"bg-slate-50":""}"><td class="py-0.5">${r[0]>=1000? (r[0]/1000).toFixed(r[0]%1000?2:0)+" km":r[0]+" m"}</td><td class="text-right">${fmtTime(r[1])}</td><td class="text-right font-bold">${fmtTime(r[2])}</td><td class="text-right text-emerald-700">${fmtTime(neg[i]*scale)}</td><td class="text-right text-emerald-700">${fmtTime(negRows[i]*scale)}</td></tr>`).join("")}
      </tbody></table>
      <div class="text-xs text-slate-500 mt-2">負分割建議：前 1/3 慢 2%、中段均速、後 1/3 快 2%（總時間相同）。比賽日前 3 km 再加上「不要鑽人群」的 3–5 秒餘裕。</div>
    </div>
  </div>`;
}

// ------------------------------------------------------------ coach chat log
function renderChat(){
  const log = D.chat_log||[];
  $("#tab-chat").innerHTML = `
  <div class="card p-5"><div class="font-black text-lg">教練室 Q&A（Google Chat 討論整理）</div>
    <div class="text-sm text-slate-600 mt-1">在 Google Chat「🏃 半馬 87 教練室」提問或上傳跑步影片，教練回覆後會把重點整理到這裡（不受半天同步限制，問完即更新）。</div></div>
  ${log.length? log.map(e=>`<div class="card p-5 stripe" style="border-color:${e.kind==="video"?"#a855f7":"#0ea5e9"}">
      <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500"><span class="font-bold">${esc(e.ts)}</span>${e.kind==="video"?'<span class="badge bg-violet-100 text-violet-700">🎥 影片分析</span>':'<span class="badge bg-sky-100 text-sky-700">💬 問答</span>'}${(e.tags||[]).map(t=>`<span class="badge bg-slate-100 text-slate-600">#${esc(t)}</span>`).join("")}</div>
      <div class="font-black mt-1">Q：${esc(e.question)}</div>
      <div class="text-sm text-slate-700 mt-2 leading-relaxed whitespace-pre-line">${esc(e.answer)}</div>
      ${e.insights&&e.insights.length?`<div class="mt-3 text-sm bg-amber-50 border border-amber-200 rounded-xl p-3"><b>📌 重點／對課表的影響：</b><ul class="list-disc pl-5 mt-1">${e.insights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    </div>`).join("") : `<div class="card p-6 text-sm text-slate-500">尚無討論紀錄。</div>`}`;
}

// ------------------------------------------------------------ method
function renderMethod(){
  $("#tab-method").innerHTML = `
  <div class="grid md:grid-cols-2 gap-4">${D.methodology.map(m=>`<div class="card p-5"><div class="font-black text-lg">${m.icon} ${esc(m.name)}</div><p class="text-sm text-slate-700 leading-relaxed mt-2">${esc(m.text)}</p></div>`).join("")}</div>
  <div class="card p-5"><div class="font-black text-lg mb-2">名詞速查</div><dl class="kv text-sm">
    <dt>跑休</dt><dd>組間以非常慢的慢跑（約 E 配速 +20～30 秒）恢復，不停下來。優點：維持攝氧量在高檔、下一趟更快進入狀態；適合 ≥600 m 的間歇與所有閾值課。</dd>
    <dt>停休</dt><dd>組間站立或走動。適合 ≤400 m 的短間歇、R 配速反覆跑與大步跑，讓每一趟都能維持速度品質。</dd>
    <dt>等時跑休</dt><dd>跑多久就慢跑多久（例：800 m 跑 3:00，就慢跑 3:00）。</dd>
    <dt>HMP</dt><dd>半馬目標配速。本計畫從目前實力對應的半馬配速逐週逼近 4:07（87 分）；每次新增訓練後重算。</dd>
    <dt>T / I / R</dt><dd>Daniels 閾值 / 間歇 (VO2max) / 反覆 (速度) 配速。</dd>
    <dt>心率漂移</dt><dd>同一配速下後半段心率上升的幅度（效率衰退）；<5% 表示該配速對你是可持續的，>10% 表示有氧耐力不足或環境/狀態不佳。</dd>
    <dt>ACWR</dt><dd>急性 (7 天) / 慢性 (28 天平均) 跑量比。0.8–1.3 安全，>1.5 受傷風險顯著上升。</dd>
  </dl></div>`;
}
</script>
